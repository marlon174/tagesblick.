<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tagesblick.</title>
<meta name="description" content="Nachrichten aus Musterstadt und der Welt – kurz, klar und verständlich.">
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
<link rel="icon" href="bilder/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="bilder/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
<!--
  Zeigt alle Artikel einer Rubrik: rubrik.html#sport
  Ohne Rubrik (nur rubrik.html) erscheinen alle Meldungen nach Tagen sortiert.
  Diese Datei musst du normalerweise nicht ändern.
-->
<script>try{var d=localStorage.getItem("tagesblick-design");if(d==="dark"||d==="light")document.documentElement.setAttribute("data-theme",d)}catch(e){}</script>
<script defer src="js/app.js"></script>
<script defer src="inhalt/einstellungen.js"></script>
<script defer src="inhalt/artikel.js"></script>
</head>
<body data-seite="rubrik">
<a class="skip" href="#tb-inhalt">Zum Inhalt springen</a>
<div id="tb-kopf"></div>
<nav id="tb-navi" class="navi" aria-label="Rubriken"></nav>
<main id="tb-inhalt">
  <noscript><div class="wrap"><p class="hinweis">Bitte schalte JavaScript ein, damit hier die Artikel erscheinen.</p></div></noscript>
</main>
<footer id="tb-fuss" class="fuss"></footer>
</body>
</html>
