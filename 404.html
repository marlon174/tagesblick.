<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seite nicht gefunden – tagesblick.</title>
<!--
  Diese Seite zeigt GitHub Pages an, wenn eine Adresse nicht existiert.
  Das kleine Skript sorgt dafür, dass Bilder und Stile auch dann gefunden
  werden, wenn die falsche Adresse in einem Unterordner liegt.
-->
<script>
  (function () {
    var teile = location.pathname.split("/");
    if (/\.github\.io$/.test(location.hostname) && teile.length > 2) {
      var basis = document.createElement("base");
      basis.href = "/" + teile[1] + "/";
      document.head.appendChild(basis);
    }
  })();
</script>
<meta name="theme-color" content="#f4f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
<link rel="icon" href="bilder/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<script>try{var d=localStorage.getItem("tagesblick-design");if(d==="dark"||d==="light")document.documentElement.setAttribute("data-theme",d)}catch(e){}</script>
<script defer src="js/app.js"></script>
<script defer src="inhalt/einstellungen.js"></script>
<script defer src="inhalt/artikel.js"></script>
</head>
<body data-seite="text">
<a class="skip" href="#tb-inhalt">Zum Inhalt springen</a>
<div id="tb-kopf"></div>
<nav id="tb-navi" class="navi" aria-label="Rubriken"></nav>
<main id="tb-inhalt">
  <div class="wrap">
    <div class="leer">
      <h1 class="seitentitel">Seite nicht gefunden<span class="schlusspunkt">.</span></h1>
      <p>Diese Adresse gibt es bei tagesblick. nicht (mehr). Vielleicht wurde der Artikel umbenannt. Die Suche hilft dir weiter.</p>
      <p class="kicker"><a class="knopf" href="index.html">Zur Startseite</a> <a class="knopf" href="suche.html">Zur Suche</a></p>
    </div>
  </div>
</main>
<footer id="tb-fuss" class="fuss"></footer>
</body>
</html>
